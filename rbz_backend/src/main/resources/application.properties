# Server Configuration
server.port=${SERVER_PORT:8080}

# PostgreSQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/rbz_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Logging Configuration
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# JWT — required. Set JWT_SECRET env var to a random string of at least 64 characters.
# Generate one with: openssl rand -hex 64
jwt.secret=${JWT_SECRET}

# CORS allowed origins — required. Set CORS_ORIGINS env var to the production frontend URL.
# For local dev, use application-local.properties or set: export CORS_ORIGINS=http://localhost:3000
cors.allowed-origins=${CORS_ORIGINS}

# File Upload Configuration (must align with FileSecurityHelper.MAX_FILE_SIZE_BYTES)
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_SIZE:25MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_SIZE:25MB}

# PII Column Encryption — required. Must be exactly 32 characters (AES-256).
# Generate with: openssl rand -hex 16
pii.encryption.key=${PII_ENCRYPTION_KEY}

# Email Notifications (SMTP)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
rbz.notification.from=${MAIL_FROM:noreply@rbz.co.zw}
rbz.notification.enabled=${MAIL_ENABLED:false}

